<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Baralai High School</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../assets/css/login.css" />
    <link rel="stylesheet" href="../assets/css/layout-clean.css" />
  </head>

  <body class="login-page">
    <div class="main-container">
      <div class="card left-card">
        <div class="logo">
          <i class="fas fa-school"></i>
          Baralai <br />High School
        </div>
        <p>Est. 1992 · Excellence in Education</p>
      </div>

      <div class="card right-card">
        <div id="loginView">
          <div class="header-section">
            <div class="admin-icon-wrapper">
              <i class="fa-solid fa-user"></i>
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Admin Login</h2>
            <p>Sign in to access admin panel</p>
          </div>

          <form id="loginForm">
            <div class="input-group">
              <label><i class="fa-solid fa-user"></i> Email</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-user icon-left"></i>
                <input
                  type="email"
                  id="username"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>
            <div class="input-group">
              <label><i class="fa-solid fa-lock"></i> Password</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock icon-left"></i>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  required
                />
                <i class="fa-solid fa-eye icon-right" id="togglePassword"></i>
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" id="remember" />
                <span class="checkmark"></span>
                <span>Remember me</span>
              </label>
              <a
                href="#"
                class="forgot-link"
                onclick="
                  showMessage(
                    'Forgot password functionality is disabled in frontend mode',
                    'info',
                  );
                  return false;
                "
              >
                Forgot password?
              </a>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
              <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>

            <div class="backbtn">
              <a href="../index.html">
                <i class="fa-solid fa-arrow-left-long"></i>Back to the Website
              </a>
            </div>
            <div id="message"></div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
